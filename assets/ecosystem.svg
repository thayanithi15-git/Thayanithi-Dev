<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
    <rect width="100%" height="100%" fill="#ffffff"/>
    
    <!-- Box: Client/Frontend -->
    <rect x="50" y="30" width="180" height="70" rx="4" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
    <text x="140" y="60" font-family="monospace" font-size="14" font-weight="bold" fill="#0d1117" text-anchor="middle">Frontend Platforms</text>
    <text x="140" y="80" font-family="monospace" font-size="11" fill="#57606a" text-anchor="middle">Next.js / React / Vue</text>
    
    <!-- Box: Backend API -->
    <rect x="310" y="30" width="180" height="70" rx="4" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
    <text x="400" y="60" font-family="monospace" font-size="14" font-weight="bold" fill="#0d1117" text-anchor="middle">Backend Services</text>
    <text x="400" y="80" font-family="monospace" font-size="11" fill="#57606a" text-anchor="middle">Node.js / Express / Go</text>

    <!-- Box: Databases & Cloud -->
    <rect x="570" y="30" width="180" height="70" rx="4" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
    <text x="660" y="60" font-family="monospace" font-size="14" font-weight="bold" fill="#0d1117" text-anchor="middle">Databases &amp; Cloud</text>
    <text x="660" y="80" font-family="monospace" font-size="11" fill="#57606a" text-anchor="middle">GCP / Postgres / Mongo</text>

    <!-- Connectors (Vector Arrows) -->
    <line x1="230" y1="65" x2="300" y2="65" stroke="#d0d7de" stroke-width="2"/>
    <polygon points="300,61 308,65 300,69" fill="#d0d7de"/>

    <line x1="490" y1="65" x2="560" y2="65" stroke="#d0d7de" stroke-width="2"/>
    <polygon points="560,61 568,65 560,69" fill="#d0d7de"/>

    <!-- Bottom Description -->
    <rect x="50" y="140" width="700" height="70" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="70" y="165" font-family="monospace" font-size="13" fill="#0d1117">SYSTEM TOPO: Decentralized API integration, scalable microservices, telemetry visualization</text>
    <text x="70" y="190" font-family="monospace" font-size="13" fill="#57606a">Status: Operational [100% stable execution]</text>
  </svg>